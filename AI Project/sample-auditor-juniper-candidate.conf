set system host-name branch-junos-01
set system services ssh
set system services telnet
set system services netconf ssh
set system login user netadmin class super-user
set system login user netadmin authentication encrypted-password "$6$SYNTHETIC-NOT-A-REAL-HASH"
set system syslog file messages any notice
set system syslog file messages authorization info
set snmp community public authorization read-only
set vlans USERS vlan-id 10
set vlans VOICE vlan-id 20
set vlans GUEST vlan-id 30
set interfaces ge-0/0/1 description "User workstation"
set interfaces ge-0/0/1 unit 0 family ethernet-switching interface-mode access
set interfaces ge-0/0/1 unit 0 family ethernet-switching vlan members GUEST
set protocols rstp interface ge-0/0/1 edge
delete protocols rstp bpdu-block-on-edge
set interfaces ge-0/0/47 description "Uplink to distribution"
set interfaces ge-0/0/47 unit 0 family ethernet-switching interface-mode trunk
set interfaces ge-0/0/47 unit 0 family ethernet-switching vlan members all
