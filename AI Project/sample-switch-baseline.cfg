!
hostname access-sw-01
!
service password-encryption
!
ip domain-name example.local
!
aaa new-model
!
aaa authentication login default group radius local
aaa authorization exec default group radius local
radius server RAD-A
 address ipv4 192.0.2.30 auth-port 1812 acct-port 1813
!
ip ssh version 2
!
no ip http server
no ip http secure-server
!
snmp-server group NETOPS v3 priv
snmp-server host 192.0.2.50 version 3 priv NETOPS
!
logging host 192.0.2.60
logging trap warnings
ntp server 192.0.2.70 prefer
!
ip access-list standard MGMT-SOURCES
 permit 192.0.2.0 0.0.0.255
!
ip access-list extended GUEST-IN
 permit udp any any eq domain
 deny ip any 192.0.2.0 0.0.0.255
!
ip dhcp snooping
ip dhcp snooping vlan 20,30
!
spanning-tree mode rapid-pvst
spanning-tree portfast default
spanning-tree bpduguard default
!
interface GigabitEthernet1/0/1
 description User workstation
 switchport mode access
 switchport access vlan 20
 switchport port-security
 switchport port-security maximum 2
 spanning-tree portfast
 spanning-tree bpduguard enable
 storm-control broadcast level 5.00
!
interface GigabitEthernet1/0/24
 description Uplink to distribution
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30
 switchport trunk native vlan 999
 ip dhcp snooping trust
!
interface Port-channel1
 description Aggregated uplink
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30
 switchport trunk native vlan 999
!
interface GigabitEthernet1/0/23
 description Member link to distribution
 channel-group 1 mode active
!
interface Vlan99
 description Switch management
 ip address 192.0.2.10 255.255.255.0
 no shutdown
!
line vty 0 4
 transport input ssh
 access-class MGMT-SOURCES in
 exec-timeout 10 0
 login authentication default
!
banner motd ^Authorized management only.^
!
end
